<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="margin:0;padding:0;background:#f4f6f9;">
<div style="max-width:600px;margin:0 auto;font-family:'Helvetica Neue',Arial,sans-serif;">

  <!-- Header -->
  <div style="background:#2980b9;padding:24px 30px;border-radius:8px 8px 0 0;">
    <h1 style="margin:0;color:#fff;font-size:22px;">📋 請假申請通知</h1>
  </div>

  <!-- Body -->
  <div style="background:#fff;padding:30px;border-left:1px solid #e0e0e0;border-right:1px solid #e0e0e0;">
    <p style="font-size:16px;color:#333;">
      您的下屬 <strong th:text="${applicantName}">申請人</strong> 提交了一份請假申請：
    </p>

    <table style="border-collapse:collapse;width:100%;margin:16px 0;">
      <tr>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;background:#f8f9fa;font-weight:bold;width:120px;">申請人</td>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;" th:text="${applicantName}">申請人</td>
      </tr>
      <tr>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;background:#f8f9fa;font-weight:bold;">假別</td>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;" th:text="${leaveTypeName}">假別</td>
      </tr>
      <tr>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;background:#f8f9fa;font-weight:bold;">開始時間</td>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;" th:text="${startTime}">開始</td>
      </tr>
      <tr>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;background:#f8f9fa;font-weight:bold;">結束時間</td>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;" th:text="${endTime}">結束</td>
      </tr>
      <tr>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;background:#f8f9fa;font-weight:bold;">職務代理人</td>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;" th:text="${agentName} ?: '未指定'">代理人</td>
      </tr>
    </table>

    <div style="background:#e8f4fd;border-left:4px solid #2980b9;padding:14px 18px;margin:20px 0;border-radius:4px;">
      <p style="margin:0;color:#1a5276;font-size:15px;">請登入系統進行簽核。</p>
    </div>
  </div>

  <!-- Footer -->
  <div style="background:#f4f6f9;padding:16px 30px;border-radius:0 0 8px 8px;text-align:center;">
    <p style="margin:0;color:#999;font-size:13px;">此信件由考勤管理系統自動發送，請勿直接回覆。</p>
  </div>

</div>
</body>
</html>
