<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="margin:0;padding:0;background:#f4f6f9;">
<div style="max-width:600px;margin:0 auto;font-family:'Helvetica Neue',Arial,sans-serif;">

  <!-- Header -->
  <div style="background:#2c3e50;padding:24px 30px;border-radius:8px 8px 0 0;">
    <h1 style="margin:0;color:#fff;font-size:22px;">📋 考勤管理系統</h1>
  </div>

  <!-- Body -->
  <div style="background:#fff;padding:30px;border-left:1px solid #e0e0e0;border-right:1px solid #e0e0e0;">
    <p style="font-size:16px;color:#333;" th:text="'您好，' + ${name} + '：'">您好：</p>
    <p style="font-size:16px;color:#333;">您的考勤系統帳號已建立，請使用以下資訊登入：</p>

    <table style="border-collapse:collapse;width:100%;max-width:400px;margin:16px 0;">
      <tr>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;background:#f8f9fa;font-weight:bold;width:120px;">帳號</td>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;" th:text="${email}">email</td>
      </tr>
      <tr>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;background:#f8f9fa;font-weight:bold;">初始密碼</td>
        <td style="padding:12px 16px;border:1px solid #e0e0e0;font-family:monospace;font-size:15px;" th:text="${password}">password</td>
      </tr>
    </table>

    <div style="background:#fff3cd;border-left:4px solid #ffc107;padding:14px 18px;margin:20px 0;border-radius:4px;">
      <p style="margin:0;color:#856404;font-weight:bold;">⚠️ 請於首次登入後立即修改密碼。</p>
    </div>
  </div>

  <!-- Footer -->
  <div style="background:#f4f6f9;padding:16px 30px;border-radius:0 0 8px 8px;text-align:center;">
    <p style="margin:0;color:#999;font-size:13px;">此信件由考勤管理系統自動發送，請勿直接回覆。</p>
  </div>

</div>
</body>
</html>
